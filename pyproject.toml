[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "celerity-lab"
version = "0.2.0"
description = "Celerity performance lab with repeatable benchmarks and distributed tracing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2,<3",
  "httpx>=0.28,<1",
  "opentelemetry-sdk>=1.32,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.32,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "locust>=2.32,<3", "psutil>=5.9,<8"]

[project.scripts]
celerity = "celerity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

